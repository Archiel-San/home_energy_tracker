spring.application.name=device-service


server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/home_energy_tracker
spring.datasource.username=postgres
spring.datasource.password=pgpwd
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none


# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}
